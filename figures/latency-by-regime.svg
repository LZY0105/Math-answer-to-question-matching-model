<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img">
  <style>
    .surface { fill: #fcfcfb; }
    .ink   { fill: #0b0b0b; }
    .muted { fill: #52514e; }
    .grid  { stroke: #e6e5e1; }
    .s1f { fill: #2a78d6; } .s1s { stroke: #2a78d6; }
    .s2f { fill: #eb6834; } .s2s { stroke: #eb6834; }
    .crit { fill: #d03b3b; stroke: #d03b3b; }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 600; }
    .sub   { font-size: 12px; }
    .lab   { font-size: 12px; }
    .tick  { font-size: 11px; }
    .val   { font-size: 11px; font-weight: 600; }
    .grid  { stroke-width: 1; }
    .axis  { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .ink   { fill: #ffffff; }
      .muted { fill: #c3c2b7; }
      .grid  { stroke: #333331; }
      .s1f { fill: #3987e5; } .s1s { stroke: #3987e5; }
      .s2f { fill: #d95926; } .s2s { stroke: #d95926; }
    }
    
  </style><rect width="760" height="340" class="surface"/><line x1="190.0" y1="62" x2="190.0" y2="286" class="grid"/><text x="190.0" y="304" text-anchor="middle" class="tick muted">0</text><line x1="272.0" y1="62" x2="272.0" y2="286" class="grid"/><text x="272.0" y="304" text-anchor="middle" class="tick muted">300</text><line x1="354.0" y1="62" x2="354.0" y2="286" class="grid"/><text x="354.0" y="304" text-anchor="middle" class="tick muted">600</text><line x1="436.0" y1="62" x2="436.0" y2="286" class="grid"/><text x="436.0" y="304" text-anchor="middle" class="tick muted">900</text><line x1="518.0" y1="62" x2="518.0" y2="286" class="grid"/><text x="518.0" y="304" text-anchor="middle" class="tick muted">1200</text><line x1="600.0" y1="62" x2="600.0" y2="286" class="grid"/><text x="600.0" y="304" text-anchor="middle" class="tick muted">1500</text><line x1="682.0" y1="62" x2="682.0" y2="286" class="grid"/><text x="682.0" y="304" text-anchor="middle" class="tick muted">1800</text><line x1="600.0" y1="54" x2="600.0" y2="286" class="crit" stroke-width="1.5" stroke-dasharray="5 4"/><text x="594.0" y="50" text-anchor="end" class="val crit">1500 ms alignment deadline</text><line x1="231.0" y1="62" x2="231.0" y2="286" class="s2s" stroke-width="1.2" stroke-dasharray="3 3"/><text x="237.0" y="322.0" class="tick s2f">150 ms target</text><rect x="190.3" y="84.0" width="2.0" height="12" rx="6" class="s1f" opacity="0.32"/><circle cx="190.3" cy="90.0" r="4.5" class="s1f"/><circle cx="190.8" cy="90.0" r="4.5" class="s1f"/><circle cx="190.3" cy="90.0" r="4.5" class="s1f"/><text x="178" y="94.0" text-anchor="end" class="lab muted">both bookmarked</text><text x="198.8" y="94.0" class="val ink">1–3 ms</text><rect x="206.7" y="140.0" width="204.2" height="12" rx="6" class="s1f" opacity="0.32"/><circle cx="206.7" cy="146.0" r="4.5" class="s1f"/><circle cx="410.9" cy="146.0" r="4.5" class="s1f"/><circle cx="345.0" cy="146.0" r="4.5" class="s1f"/><text x="178" y="150.0" text-anchor="end" class="lab muted">answer key not bookmarked</text><text x="418.9" y="150.0" class="val ink">61–808 ms</text><rect x="279.4" y="196.0" width="340.6" height="12" rx="6" class="s1f" opacity="0.32"/><circle cx="279.4" cy="202.0" r="4.5" class="s1f"/><circle cx="620.0" cy="202.0" r="4.5" class="s1f"/><circle cx="420.1" cy="202.0" r="4.5" class="s1f"/><text x="178" y="206.0" text-anchor="end" class="lab muted">exercise book not bookmarked</text><text x="628.0" y="206.0" class="val ink">327–1573 ms</text><rect x="203.9" y="252.0" width="238.9" height="12" rx="6" class="s1f" opacity="0.32"/><circle cx="203.9" cy="258.0" r="4.5" class="s1f"/><circle cx="371.5" cy="258.0" r="4.5" class="s1f"/><circle cx="442.8" cy="258.0" r="4.5" class="s1f"/><text x="178" y="262.0" text-anchor="end" class="lab muted">neither bookmarked</text><text x="450.8" y="262.0" class="val ink">51–925 ms</text><line x1="190" y1="62" x2="190" y2="286" class="grid axis"/><text x="436.0" y="330" text-anchor="middle" class="lab muted">95th-percentile per-page matching latency (ms), range across the three matched pairs</text><text x="20" y="24" class="title ink">Without bookmarks, the worst pair reaches the deadline</text><text x="20" y="42" class="sub muted">Bookmarked pages resolve at stage 0 and never reach content scoring; each dot is one pair</text></svg>
