<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img">
  <style>
    .surface { fill: #fcfcfb; }
    .ink   { fill: #0b0b0b; }
    .muted { fill: #52514e; }
    .grid  { stroke: #e6e5e1; }
    .s1f { fill: #2a78d6; } .s1s { stroke: #2a78d6; }
    .s2f { fill: #eb6834; } .s2s { stroke: #eb6834; }
    .crit { fill: #d03b3b; stroke: #d03b3b; }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 600; }
    .sub   { font-size: 12px; }
    .lab   { font-size: 12px; }
    .tick  { font-size: 11px; }
    .val   { font-size: 11px; font-weight: 600; }
    .grid  { stroke-width: 1; }
    .axis  { stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .ink   { fill: #ffffff; }
      .muted { fill: #c3c2b7; }
      .grid  { stroke: #333331; }
      .s1f { fill: #3987e5; } .s1s { stroke: #3987e5; }
      .s2f { fill: #d95926; } .s2s { stroke: #d95926; }
    }
    
  </style><rect width="760" height="470" class="surface"/><defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="grid" fill="currentColor" stroke="none"/></marker></defs><rect x="160" y="8" width="180" height="30" rx="6" class="grid"/><text x="250" y="27" text-anchor="middle" class="tick muted">question on the current page</text><rect x="160" y="8" width="180" height="30" rx="6" fill="none" class="grid" stroke-width="1.5"/><line x1="250" y1="38" x2="250" y2="56" class="grid" stroke-width="1.5" marker-end="url(#ah)"/><path d="M250,60 L355,97 L250,134 L145,97 Z" class="grid"/><text x="250" y="87" text-anchor="middle" class="tick muted" font-weight="600">Stage 0</text><text x="250" y="101" text-anchor="middle" class="tick muted">exact hierarchical id in</text><text x="250" y="115" text-anchor="middle" class="tick muted">both bookmark trees?</text><path d="M250,60 L355,97 L250,134 L145,97 Z" fill="none" class="grid" stroke-width="1.5"/><line x1="250" y1="134" x2="250" y2="164" class="grid" stroke-width="1.5" marker-end="url(#ah)"/><text x="242" y="147" text-anchor="end" class="tick muted">no</text><path d="M250,168 L355,205 L250,242 L145,205 Z" class="grid"/><text x="250" y="195" text-anchor="middle" class="tick muted" font-weight="600">Stage 1</text><text x="250" y="209" text-anchor="middle" class="tick muted">chapters alignable?</text><text x="250" y="223" text-anchor="middle" class="tick muted">monotonic, depth-aware</text><path d="M250,168 L355,205 L250,242 L145,205 Z" fill="none" class="grid" stroke-width="1.5"/><line x1="250" y1="242" x2="250" y2="272" class="grid" stroke-width="1.5" marker-end="url(#ah)"/><text x="242" y="255" text-anchor="end" class="tick muted">no</text><path d="M250,276 L355,313 L250,350 L145,313 Z" class="grid"/><text x="250" y="303" text-anchor="middle" class="tick muted" font-weight="600">Stage 2</text><text x="250" y="317" text-anchor="middle" class="tick muted">content decisive?</text><text x="250" y="331" text-anchor="middle" class="tick muted">operator context</text><path d="M250,276 L355,313 L250,350 L145,313 Z" fill="none" class="grid" stroke-width="1.5"/><line x1="250" y1="350" x2="250" y2="380" class="grid" stroke-width="1.5" marker-end="url(#ah)"/><text x="242" y="363" text-anchor="end" class="tick muted">no</text><path d="M250,384 L355,421 L250,458 L145,421 Z" class="grid"/><text x="250" y="411" text-anchor="middle" class="tick muted" font-weight="600">Stage 3</text><text x="250" y="425" text-anchor="middle" class="tick muted">position established</text><text x="250" y="439" text-anchor="middle" class="tick muted">by neighbours?</text><path d="M250,384 L355,421 L250,458 L145,421 Z" fill="none" class="grid" stroke-width="1.5"/><line x1="355" y1="97" x2="540" y2="97" class="grid" stroke-width="1.5" marker-end="url(#ah)"/><text x="455.5" y="95" text-anchor="start" class="tick muted">yes — 508/508 here</text><rect x="548" y="76" width="170" height="42" rx="6" class="s1f"/><text x="633" y="94" text-anchor="middle" class="tick" font-weight="600" fill="#ffffff">HIGH</text><text x="633" y="108" text-anchor="middle" class="tick" fill="#ffffff">exact id</text><line x1="355" y1="313" x2="540" y2="313" class="grid" stroke-width="1.5" marker-end="url(#ah)"/><text x="455.5" y="311" text-anchor="start" class="tick muted">one clearly ahead</text><rect x="548" y="292" width="170" height="42" rx="6" class="s1f"/><text x="633" y="310" text-anchor="middle" class="tick" font-weight="600" fill="#ffffff">MEDIUM</text><text x="633" y="324" text-anchor="middle" class="tick" fill="#ffffff">content agrees</text><line x1="355" y1="421" x2="540" y2="421" class="grid" stroke-width="1.5" marker-end="url(#ah)"/><text x="455.5" y="419" text-anchor="start" class="tick muted">bracketed</text><rect x="548" y="400" width="170" height="42" rx="6" class="s2f"/><text x="633" y="418" text-anchor="middle" class="tick" font-weight="600" fill="#ffffff">LOW / MEDIUM</text><text x="633" y="432" text-anchor="middle" class="tick" fill="#ffffff">positional support</text><line x1="250" y1="458" x2="250" y2="440" class="grid" stroke-width="1.5" marker-end="url(#ah)"/><rect x="120" y="440" width="260" height="30" rx="6" class="crit"/><text x="250" y="459" text-anchor="middle" class="tick" fill="#ffffff">NONE — refused, with candidates and reason</text><text x="20" y="26" class="title ink">Four stages; a question exits at the first that can justify an answer</text></svg>
