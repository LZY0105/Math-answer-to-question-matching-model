name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The published core keeps zero runtime dependencies. The public PDF demo
      # uses PDF.js as a development-only adapter, so CI installs the locked
      # development dependency before exercising that integration path.
      - name: Install development dependencies
        run: npm ci

      # test:unit leads with test_tools.js, which parses every shipped script.
      # It is there because a released tool once did not parse at all: the other
      # suites import from src/ and never from tools/, so a file Node could not
      # read was still covered by a green run.
      - name: Unit suites
        run: npm run test:unit

      # The real-PDF corpus is extracted text from copyrighted books and is not
      # committed. This step reports the skip rather than silently passing, so a
      # green CI run never implies the real books were exercised.
      - name: Real-PDF suite (skips without the corpus)
        run: npm run test:real

      # The OCR audit fails by default when its inputs are missing, because a
      # release gate that returns success for a run that did not happen is not a
      # gate. CI has no corpus and never will, so it asks for the skip in the
      # open rather than inheriting it silently — and a release check run on a
      # machine that DOES have the corpus must omit the flag.
      - name: OCR audit (explicitly skipped in CI)
        run: node tools/audit-ocr-matches.mjs --allow-skip
